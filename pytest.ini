[pytest]
# Put the repository root on sys.path so `import ingestion` works regardless of
# how pytest is invoked.
#
# `python -m pytest` inserts the working directory automatically; the bare
# `pytest` entry point does not. CI runs the bare form, so the suite passed
# locally and failed in CI with ModuleNotFoundError at collection — the tests
# were never even reached. Fixing it here rather than by changing the CI
# command means the suite behaves the same for anyone who clones the repo,
# whichever form they type.
pythonpath = .

testpaths = tests

# Show the slowest tests on every run. The suite went from 24s to under 1s once
# the retry tests stopped genuinely sleeping through exponential backoff; this
# keeps that visible so it cannot creep back unnoticed.
addopts = --durations=5
