# Metabase, self-hosted. PRD §8b.
#
# Its own compose file rather than a service in `airflow/`, because the two have
# different lifecycles: Airflow runs on a schedule and should stay up, Metabase
# is opened when someone wants to look at something. Sharing a file would mean
# stopping one to restart the other.
#
# WHAT IT CONNECTS TO
# -------------------
# Nothing here knows about the warehouse. The connection is configured once
# inside Metabase's UI, using `f1_reporting` (migration 007) — a read-only role
# with `select` on `marts` and nothing else. Never `f1_pipeline`, which owns
# those tables: Metabase stores the credential in its own application database,
# so it should be one that can do nothing but read.
#
# THE APPLICATION DATABASE IS THE POINT
# -------------------------------------
# Metabase keeps every saved question, dashboard and setting in an application
# database of its own — **not** in the warehouse. Lose it and every dashboard
# goes with it.
#
# **Postgres, not H2, and that is a correction.** This originally ran on the
# embedded H2 default, argued as adequate for a single user on one laptop. That
# reasoning underweighted the laptop being *closed*: H2 is a file-based database
# inside the container, and an abrupt stop can leave its identity sequences
# inconsistent.
#
# It took three days to bite. After two unclean Docker shutdowns, saving a
# question failed with `Unique index or primary key violation: PRIMARY KEY ON
# PUBLIC.REPORT_DASHBOARDCARD(ID)` — H2 trying to reuse an id that already
# existed — and a second sequence, `METABASE_TABLE(ID)`, was desynced too. A
# restart recovered it, because H2 recomputes identity on open. It might not
# next time, and the failure mode is losing the lot.
#
# So Metabase gets a Postgres container of its own, the same pattern Airflow
# already uses for its metadata. Both volumes below are what must survive.
#
# BACKUP
# ------
# The volume is not in git and not in the lake. If the dashboards ever become
# expensive to rebuild:
#
#     docker run --rm -v metabase_data:/from -v "%cd%":/to alpine \
#         tar czf /to/metabase-backup.tgz -C /from .

services:
  metabase:
    # Pinned, not `latest`: a version that changes under you is a dashboard that
    # breaks for reasons unrelated to anything you did. `v0.x` is the
    # open-source edition — `v1.x` tags are the commercial build.
    image: metabase/metabase:v0.63.17
    container_name: metabase
    ports:
      # localhost only. This has no authentication beyond Metabase's own login
      # and holds a live warehouse credential, so it must not listen on 0.0.0.0.
      - "127.0.0.1:3000:3000"
    volumes:
      - metabase_data:/metabase.db
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase

      # Off. It reports usage back to Metabase, and this is a personal project
      # whose query patterns are nobody else's business.
      MB_ANON_TRACKING_ENABLED: "false"

      # The container is UTC; the warehouse stores UTC (a project
      # non-negotiable). Stating it stops Metabase inferring something else and
      # silently shifting race dates by a day.
      JAVA_TIMEZONE: UTC
    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy

  # Metabase's own metadata. Container-internal: the port is deliberately not
  # published, so these credentials are unreachable from outside the compose
  # network — the same position as Airflow's metadata Postgres.
  metabase-db:
    image: postgres:16
    container_name: metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  # Retained after the move to Postgres: it is the migration source, and the
  # only copy of anything built before 2026-09-17.
  metabase_data:
  metabase_db_data:
