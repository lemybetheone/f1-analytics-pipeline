# CI — the gate that makes a pull request mean something.
#
# On a solo project a PR review catches nothing: the author and the reviewer are
# the same person. What a PR *can* do is refuse to merge when an automated check
# fails, which is a gate no amount of care replaces at 1am. That is why this
# workflow was pulled forward from Phase 4 (see PRD § Change control).
#
# `dbt parse` was promised here "with Phase 2" and did not arrive until
# 2026-09-15, three days after Phase 2 finished — so a broken `ref()` or a
# malformed schema file would have passed CI in the meantime. It is here now.
#
# **`dbt build` stays excluded**, and not by oversight: building requires a real
# warehouse connection, and this workflow holds no credentials. `parse` is the
# half that can be checked without one — it resolves every `ref()`, `source()`
# and macro, and compiles the Jinja. Verified to have teeth: a deliberately
# broken `ref()` exits 2.
#
# sqlfluff was also promised for Phase 2 and has not been adopted. Stated rather
# than quietly dropped.
#
# No credentials, and no connection to the source API or the warehouse —
# network-dependent CI is flaky CI, and flaky CI is ignored CI. `pip install`
# and `dbt deps` do reach their package registries, which is a different thing
# from reaching the systems under test.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to match the local development environment. Reproducibility
          # is a stated requirement (PRD NFR2), and "works on my machine" is
          # exactly what a pinned CI runtime prevents.
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Validate the dbt project
        working-directory: dbt
        env:
          # profiles.yml is committed beside the project rather than in ~/.dbt
          # (ARCHITECTURE §10), so dbt has to be told where to look.
          DBT_PROFILES_DIR: .

          # Placeholders, and they never connect to anything. `dbt parse` does
          # not open a connection, but it does *render* profiles.yml — and
          # `env_var()` there has no defaults, so without these the step fails
          # with "Env var required but not provided: 'WAREHOUSE_HOST'".
          #
          # Measured, because the obvious test lies: running `dbt parse` in a
          # working tree that already has a `target/` directory succeeds without
          # any of these, since dbt reuses the cached manifest. Only a clean
          # checkout — which is what CI is — shows the real requirement.
          WAREHOUSE_HOST: parse-only-no-connection
          WAREHOUSE_PORT: "5432"
          WAREHOUSE_USER: parse-only
          WAREHOUSE_PASSWORD: parse-only
          WAREHOUSE_DATABASE: postgres
        run: |
          dbt deps
          dbt parse
