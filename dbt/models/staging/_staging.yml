version: 2

models:
  - name: stg_drivers
    description: >
      One row per driver, all of F1 history (881 rows). Types cast from the
      source's all-text payload; no joins or filtering.

      **Grain: driver_id.**
    columns:
      - name: driver_id
        description: "Natural key from the source. Stable across seasons."
        # The single highest-value test in the project: a grain that silently
        # duplicates makes every downstream count wrong, and nothing else
        # catches it.
        data_tests:
          - unique
          - not_null

      - name: full_name
        description: "First and last name joined, so every consumer spells it the same way."

      - name: date_of_birth
        description: >
          Cast from an ISO date string. **Legitimately null for 16 of 881
          drivers** (1.8%) — deliberately untested.

          Those 16 are not old drivers, as we first assumed. They are modern
          reserve and test drivers (Arthur Leclerc, Felipe Drugovich, Colton
          Herta, Dino Beganovic and others) who are registered with the sport
          but have never started a race — they appear in no results at all.
          Their records carry a name and nothing else.

          A `not_null` test here failed on the first build. It was written from
          the Phase 0 nullability profile, which sampled `2024/drivers` — 25
          current race drivers — rather than all 881. Same sampling error as
          the `FastestLap` case, in a different disguise.

      - name: nationality
        description: >
          Free text; not a controlled vocabulary. Null for the same 16
          non-racing drivers, so untested for the same reason.

      - name: driver_code
        description: >
          Three-letter TV abbreviation (VER, HAM). **Legitimately null** for
          older drivers — deliberately untested. SECURITY §4: testing a column
          that is genuinely optional produces failures that mean nothing and
          trains you to ignore the suite.

      - name: permanent_number
        description: >
          Career number. **Legitimately null** — permanent numbers only exist
          from 2014, so most of the 881 rows have none. Deliberately untested.

      - name: source_key
        description: "Lake object this row was loaded from. Lineage back to the raw JSON."
        data_tests:
          - not_null

      - name: ingested_at
        description: "When the row was first loaded."
        data_tests:
          - not_null

  - name: stg_races
    description: >
      One row per race, all of F1 history (1,172 rows, 1950–2026). Includes the
      forward schedule, so races with no results yet are expected.

      **Grain: (season, round).**
    data_tests:
      # A composite grain needs a composite test. dbt's built-in `unique` works
      # on one column only, so a two-column grain would go unenforced without
      # this — and an unenforced grain is how duplicate rows quietly double
      # every downstream count.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round]
    columns:
      - name: season
        description: "Four-digit year, cast to int so it sorts and joins numerically."
        data_tests:
          - not_null

      - name: round
        description: >
          Round within the season, cast to int — as text, round 10 would sort
          before round 2.
        data_tests:
          - not_null

      - name: race_name
        description: "e.g. 'Chinese Grand Prix'. Present for every race."
        data_tests:
          - not_null

      - name: circuit_id
        description: >
          Foreign key to the circuit. Only the key is lifted from the nested
          Circuit object; its attributes live in stg_circuits, so a correction
          upstream has one place to land.
        data_tests:
          - not_null

      - name: race_date
        description: "Race day. Present for all 1,172 races."
        data_tests:
          - not_null

      - name: race_start_utc
        description: >
          Scheduled start. **Legitimately null for ~62% of races** — the source
          records `time` for only 37.6% of them, with older races having no
          start time at all. Deliberately untested for null.

      - name: practice_1_utc
        description: "Null before the mid-2000s; sessions were not scheduled in the source."
      - name: practice_2_utc
        description: "Null before the mid-2000s. Also absent on sprint weekends, which run one practice."
      - name: practice_3_utc
        description: "Null before the mid-2000s. Also absent on sprint weekends."
      - name: qualifying_utc
        description: "Null before the mid-2000s."

      - name: sprint_utc
        description: "Non-null only on sprint weekends — 30 races in the whole dataset."

      - name: sprint_qualifying_utc
        description: >
          Coalesced across the source's two names for this session:
          `SprintQualifying` (18 races) and `SprintShootout` (6). Handled here
          so no downstream model needs to know the sport renamed it.

      - name: is_sprint_weekend
        description: >
          Derived from the presence of a Sprint block, so consumers do not test
          for a nested key. True for 30 of 1,172 races.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: stg_results
    description: >
      One row per driver per race — the core fact source. Currently 2024–2026
      (1,200 rows); the historical backfill will take it to ~26,000.

      **Grain: (season, round, driver_id).**
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, driver_id]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: driver_id
        description: "Foreign key to stg_drivers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                # Strict, because Phase 0 measured coverage at 100% across all
                # 26,115 historical rows — so a failure here is a real defect
                # rather than a known gap being rediscovered.
                to: ref('stg_drivers')
                field: driver_id

      - name: constructor_id
        description: >
          Foreign key to the constructor. Present on the fact at race grain,
          which is what makes teammate head-to-head (PRD §6 theme 4) a
          self-join rather than a separate table.
        data_tests:
          - not_null

      - name: classified_position
        description: >
          Classified order — **non-null even for retirements**. A driver who
          crashed on lap 5 still has a position. Do not use this to identify
          finishers; use `is_classified`.
        data_tests: [not_null]

      - name: position_text
        description: >
          The outcome marker: a number for a classified finish, or R (retired),
          W (withdrew), D (disqualified). This, not `classified_position`, is
          what separates a finish from a DNF.
        data_tests:
          - not_null
          # Safe to enumerate: the marker set is fixed by the sport, unlike
          # `status`, which has 136 values in the source.
          - accepted_values:
              arguments:
                values: ['R', 'W', 'D']
              config:
                # Numeric values are the other legitimate case, so only the
                # non-numeric ones are constrained.
                where: "position_text !~ '^[0-9]+$'"

      - name: points
        description: >
          Championship points. **numeric, not integer** — F1 awards half points
          for a race stopped early (2021 Belgium, several 1950s races). None
          appear in the loaded seasons, so an int cast would pass today and
          fail on backfill.
        data_tests: [not_null]

      - name: grid_position
        description: >
          Starting position. **0 means a pit lane start**, a real value rather
          than a missing one, so it is kept rather than nulled.
        data_tests: [not_null]

      - name: laps_completed
        data_tests: [not_null]

      - name: status
        description: >
          Retirement reason or finishing state. 5 distinct values in the loaded
          seasons but **136 in the source's own status list**, so deliberately
          **no accepted_values test** — one written today would break the
          moment history loads. Grouping belongs in dim_status (SCHEMA §4).
        data_tests: [not_null]

      - name: is_classified
        description: "True for a numeric position_text. The finisher test."
        data_tests: [not_null]

      - name: positions_gained
        description: >
          grid − finish for classified finishers (PRD §6 theme 3).
          **Null for DNFs and for pit lane starts** — a car that started from
          the pit lane has no grid slot to gain from, and including it would
          flatter the number.

      - name: race_time_millis
        description: "Total race time. Classified finishers on the lead lap only; legitimately null otherwise."
      - name: fastest_lap_number
        description: "Legitimately null — FastestLap is absent entirely before 2000."
      - name: fastest_lap_avg_speed_kph
        description: >
          Absent on 64% of rows even where FastestLap exists — nested blocks go
          missing at two depths. Every observed row reports kph.

  - name: stg_circuits
    description: >
      One row per circuit, all of F1 history (78 rows).

      **Grain: circuit_id.**
    columns:
      - name: circuit_id
        description: "Natural key from the source."
        data_tests: [unique, not_null]
      
      - name: circuit_name
        description: >
          Full circuit name, e.g. 'Silverstone Circuit'. Present for all 78.

          Happens to be unique today, but deliberately **not** tested for
          uniqueness: the key is `circuit_id`, and two circuits sharing a name
          in future would be a fact about the sport rather than a defect.
        data_tests:
          - not_null

      - name: country
        description: >
          Country as the source spells it — **free text, not a controlled
          vocabulary**. 34 distinct values across 78 circuits.

          Mixes full names with abbreviations: 'UK', 'USA', 'UAE' and 'Korea'
          sit alongside 'South Africa' and 'Saudi Arabia'. So it is neither ISO
          country names nor ISO codes, and joining it to any external country
          reference would need an explicit mapping.

          No `accepted_values` test: 34 values is too many to enumerate
          usefully, and the list grows whenever F1 visits a new country — a
          test that fails on a legitimate new race is worse than no test.
        data_tests:
          - not_null
      
      - name: locality
        description: >
          City or region, e.g. 'Silverstone', 'Monte-Carlo'. Not unique —
          Barcelona has three circuits (Catalunya, Montjuïc, Pedralbes),
          Madrid two, California two. Descriptive only; nothing joins on it.
        data_tests:
          - not_null

      - name: latitude
        description: >
          Decimal degrees, cast to double precision — the type geospatial
          tooling expects. Untested: not a join key, and a coordinate is an
          approximation, so there is no invariant worth asserting.

      - name: longitude
        description: "Decimal degrees, double precision. Untested, as latitude."

  - name: stg_constructors
    description: >
      One row per constructor, all of F1 history (214 rows).

      **Type 1 downstream, with no SCD2** — Phase 0 walked every constructor
      list from 1996 to 2024 and found no `constructor_id` ever carrying two
      names. Rebrands are separate ids upstream: `toro_rosso` (2006–19),
      `alphatauri` (2020–23) and `rb` (2024) are three rows here, not one row
      with three versions. ARCHITECTURE decision 18.

      **Grain: constructor_id.**
    columns:
      - name: constructor_id
        description: "Natural key from the source. Stable for the life of a brand."
        data_tests:
          - unique
          - not_null

      - name: constructor_name
        description: >
          Team name as the source spells it, e.g. 'Red Bull', 'Alpine F1 Team'.
          Renamed from the source's bare `name`, which would be ambiguous once
          joined to anything else carrying a name.

          Distinct across all 214 today, but deliberately **not** tested for
          uniqueness — nothing joins on it, and two teams sharing a name would
          be a fact about the sport rather than a defect.
        data_tests:
          - not_null

      - name: nationality
        description: >
          Team's licensing nationality, 24 distinct values. Free text, not a
          controlled vocabulary — no `accepted_values` test, since the list
          grows whenever a team licenses under a new country.

          Note it describes the *entry*, not the workforce: Alpine is French
          and RB is Italian, both operating largely from the UK.
        data_tests:
          - not_null

      - name: wikipedia_url
        description: >
          Reference link. Present for all 214, but **untested** — descriptive,
          nothing joins or filters on it. SECURITY §4: a test that would not
          change what you do if it failed is noise.

  - name: stg_status
    description: >
      One row per finishing status, 136 values — 'Finished', '+1 Lap',
      'Engine', 'Collision' and so on. Feeds dim_status, where SCHEMA §4 groups
      them into mechanical / collision / finished for PRD §6 theme 6.

      **Grain: status_id.**
    columns:
      - name: status_id
        description: "Numeric key from the source, cast from text."
        data_tests:
          - unique
          - not_null

      - name: status
        description: >
          The status description, and **the actual join key to results** —
          results carry this text and no `statusId`, so the fact joins on the
          description rather than the id.

          Tested for uniqueness because that is load-bearing here: a duplicate
          text would fan out every fact row joined to it. Contrast
          `circuit_name` and `constructor_name`, which are also unique today
          but untested, because nothing joins on them.
        data_tests:
          - unique
          - not_null

      - name: source_all_time_count
        description: >
          **Not an attribute of the status.** It is the number of times the
          status occurred across *all of F1 history*, computed by the API for
          the scope we queried — the 136 values sum to 26,115, which is the
          all-time results total, while `raw.results` currently holds 1,200.

          Kept deliberately, renamed to say what it is. After the historical
          backfill it becomes a Tier-3 reconciliation check: counting
          `fct_results` by status should reproduce these figures exactly, the
          same pattern as reconciling derived standings against the official
          ones (PRD §6). Do **not** use it as a metric — it will disagree with
          anything computed from the loaded facts.
        data_tests:
          - not_null

  - name: stg_seasons
    description: >
      One row per championship season, 1950–2026 (77 rows). The thinnest model
      in the project — the source carries only the year and a reference link.

      Included because SCHEMA §3 specifies one staging model per raw source,
      and because it is the authoritative list of seasons: a season present in
      `stg_races` but absent here would mean the reference load had drifted
      from the race schedule.

      **Grain: season.**
    columns:
      - name: season
        description: >
          Four-digit year, **cast to int to match `stg_races.season` and
          `stg_results.season`**. Left as text it cannot be joined to them at
          all — Postgres rejects `text = integer` rather than coercing.
        data_tests:
          - unique
          - not_null

      - name: wikipedia_url
        description: >
          Reference link, present for all 77. Untested — descriptive, and
          nothing joins or filters on it.

  - name: stg_sprint
    description: >
      One row per driver per sprint race (328 rows). Sprints only run on some
      weekends — 30 of 1,172 races in the whole dataset — so this is
      deliberately small and will stay small.

      Structurally near-identical to `stg_results`, and column names are kept
      identical on purpose so the two can be unioned without renaming.

      **Grain: (season, round, driver_id).**
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, driver_id]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]

      - name: driver_id
        description: "Foreign key to stg_drivers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id

      - name: constructor_id
        description: "Foreign key to the constructor, at sprint-race grain."
        data_tests: [not_null]

      - name: classified_position
        description: >
          Classified order — non-null for retirements too. Use `is_classified`
          to identify finishers, not this.
        data_tests: [not_null]

      - name: position_text
        description: >
          Outcome marker: a number for a classified finish, or R (retired, 18),
          W (withdrew, 2), D (disqualified, 1).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['R', 'W', 'D']
              config:
                where: "position_text !~ '^[0-9]+$'"

      - name: points
        description: >
          Sprint points — 8 down to 1 for the top eight. `numeric` rather than
          `int` for the same reason as results: a shortened sprint could award
          half points, and the cast costs nothing.
        data_tests: [not_null]

      - name: grid_position
        description: "Starting position for the sprint, set by sprint qualifying."
        data_tests: [not_null]

      - name: laps_completed
        description: "Sprints are short — around 19 laps rather than a race's ~57."
        data_tests: [not_null]

      - name: status
        description: >
          5 distinct values in the loaded sprints. No `accepted_values` test,
          for the same reason as results — the source defines 136.
        data_tests: [not_null]

      - name: is_classified
        description: "True for a numeric position_text. The finisher test."
        data_tests: [not_null]

      - name: positions_gained
        description: >
          grid − finish for classified finishers. Null for DNFs. No pit lane
          starts appear in the loaded sprints, but the guard is kept for
          consistency with `stg_results`.

      - name: race_time_millis
        description: >
          Total sprint time, classified finishers on the lead lap only —
          307 of 328. Named `race_time_*` rather than `sprint_time_*` so the
          column lines up with `stg_results` for a future union.

      - name: fastest_lap_number
        description: "Null on 9 of 328 rows — a driver who set no timed lap."
      - name: fastest_lap_rank
        description: "Null on the same 9 rows."
      - name: fastest_lap_time_display
        description: >
          Lap time as text, e.g. '1:40.331'. Kept as text at staging — it is
          not a number, and converting to milliseconds is a mart decision.
  - name: stg_qualifying
    description: >
      One row per driver per qualifying session (1,197 rows for 2024–2026).

      Unlike the race and sprint models this has no points, status,
      positionText or Time block — qualifying has its own shape, so the
      structure is not shared with them.

      **Grain: (season, round, driver_id).**
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, driver_id]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]

      - name: driver_id
        description: "Foreign key to stg_drivers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id

      - name: constructor_id
        data_tests: [not_null]

      - name: qualifying_position
        description: >
          Position set in qualifying. **Not the same as
          `stg_results.grid_position`** — penalties move drivers between the
          two, and comparing them is how a grid penalty becomes visible.
        data_tests: [not_null]

      - name: q1_time
        description: >
          Q1 lap as text, e.g. '1:30.031'. **Legitimately null on 33 rows** —
          drivers who took part but set no time. Not cast: the format is
          minutes:seconds.thousandths and converts to no numeric type.

      - name: q2_time
        description: >
          Null in two distinct situations: eliminated in Q1 (298 rows, key
          absent) or reached Q2 and set no time (30 rows, empty string
          normalised to NULL). Use `reached_q2` to tell them apart.

      - name: q3_time
        description: >
          Null for the 606 rows eliminated before Q3, and the 24 that reached
          it without setting a time.

      - name: reached_q2
        description: >
          Read from **key presence**, not from whether a time exists — a driver
          who reached Q2 and crashed without a lap still reached it.
        data_tests: [not_null]

      - name: reached_q3
        description: "Key presence, as reached_q2. True for the top ten."
        data_tests: [not_null]

      - name: decisive_time
        description: >
          The lap that set the grid slot — the last session in which the driver
          recorded a time, coalesced Q3 → Q2 → Q1. Null only for those who set
          no time at all, so it is untested.

      - name: eliminated_in
        description: "Which session the driver's qualifying ended in."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Q1', 'Q2', 'Q3']

      - name: set_no_time
        description: "Took part but recorded no lap. True on 33 rows."
        data_tests: [not_null]

  - name: stg_pitstops
    description: >
      One row per pit stop (2,081 rows for 2024–2026).

      **Grain: (season, round, driver_id, stop_number).** `stop_number` is
      load-bearing — 2,081 rows span only 1,134 driver-races, so without it 45%
      of rows would collide.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, driver_id, stop_number]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: stop_number
        description: "Which stop of the race, 1-based. Part of the grain."
        data_tests: [not_null]
      - name: lap
        description: "Lap the stop was taken on."
        data_tests: [not_null]
      - name: duration_display
        description: >
          Duration exactly as the source gives it. Usually plain seconds
          ('25.208'), but 83 rows carry a minutes component ('1:01.930', and up
          to '39:54.053' under a red flag). Kept verbatim so nothing is lost to
          the conversion.

          **Legitimately null on 2 rows** — stops recorded with no timing at
          all, empty strings in the source normalised to NULL here.
          Deliberately untested.

      - name: duration_seconds
        description: >
          `duration_display` normalised to seconds, handling both formats — a
          plain `::numeric` cast fails outright on the mm:ss values, and
          raises rather than returning null on the two empty ones.

          Null on the same 2 rows, so untested. A `not_null` test here failed
          on the first build with a database error, which is what surfaced the
          empty durations in the first place.
      - name: stop_time_local
        description: >
          **Local wall-clock time of day** the stop happened ('18:05:33') — not
          a duration and not a timestamp. No date, no zone, so it cannot be
          made UTC as CONVENTIONS require without the circuit's offset, which
          the source does not provide. Left as text rather than cast into
          something that looks like a timestamp but is not.
        data_tests: [not_null]

  - name: stg_driver_standings
    description: >
      Championship table after each round (1,259 rows for 2024–2026). A
      periodic snapshot whose snapshot key is `round`, already part of the
      natural key — which is why no `snapshot_date` column is needed.

      **Grain: (season, round, driver_id).**
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, driver_id]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id

      - name: championship_position
        description: >
          **Legitimately null on 8 rows** — deliberately untested. Drivers on
          zero points and zero wins early in a season, before anyone has
          separated them (2025 round 1 has six). The source declines to rank an
          entirely tied field rather than inventing an order.

      - name: position_text
        description: >
          Always present, and carries '-' on exactly the 8 rows where
          `championship_position` is null.
        data_tests: [not_null]

      - name: points
        description: "numeric, not int — F1 awards half points for a shortened race."
        data_tests: [not_null]

      - name: wins
        data_tests: [not_null]

      - name: constructor_count
        description: >
          How many constructors the driver has raced for this season. 2 on 62
          rows — Oliver Bearman drove for Ferrari and Haas across 2024.
        data_tests: [not_null]

      - name: constructor_ids
        description: >
          The constructor list preserved as an array rather than flattened.
          Collapsing it to one id would silently pick a winner and imply a
          driver has exactly one team per season, which is false. The
          single-valued driver-to-constructor relationship lives on
          `stg_results` at race grain instead — the reason PRD §6 puts
          `constructor_key` on the results fact.

      - name: is_unranked
        description: "True where the source declined to rank the driver. 8 rows."
        data_tests: [not_null]

      - name: changed_constructor_in_season
        description: "True where constructor_count > 1. 62 rows."
        data_tests: [not_null]

  - name: stg_constructor_standings
    description: >
      Constructors' championship after each round (601 rows for 2024–2026).
      Counterpart to `stg_driver_standings`, split by entity rather than
      combined into one polymorphic fact — a key that is sometimes a driver and
      sometimes a constructor needs a nullable foreign key and breaks clean
      `relationships` tests on both sides (PRD §6).

      The cleanest payload in the project: five keys, all present on every row,
      no missing positions, no '-' marker, and `Constructor` is a single object
      rather than a list. Verified rather than assumed — two tables looking
      alike is exactly when a shared assumption goes wrong.

      **Grain: (season, round, constructor_id).**
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, constructor_id]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_constructors')
                field: constructor_id
      - name: championship_position
        description: "Present on every row here, unlike driver standings."
        data_tests: [not_null]
      - name: position_text
